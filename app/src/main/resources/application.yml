spring:
  application:
    name: ecp
  modulith:
    # The composition root has web/config/events packages; only explicitly annotated bounded
    # contexts are application modules. This keeps those packages outside the module graph.
    detection-strategy: explicitly-annotated
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    # Flyway owns the schema. Hibernate validates entity mappings but never changes tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${ECP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 2147483647

ecp:
  cursor:
    # Secrets are supplied only by the runtime environment. Keep the previous pair populated
    # during a key rotation so already-issued continuation tokens remain valid.
    active-key-id: ${ECP_CURSOR_ACTIVE_KEY_ID:cursor-v1}
    active-key: ${ECP_CURSOR_ACTIVE_KEY:}
    previous-key-id: ${ECP_CURSOR_PREVIOUS_KEY_ID:}
    previous-key: ${ECP_CURSOR_PREVIOUS_KEY:}
  redis:
    cache:
      host: ${ECP_REDIS_CACHE_HOST:localhost}
      port: ${ECP_REDIS_CACHE_PORT:6379}
    state:
      host: ${ECP_REDIS_STATE_HOST:localhost}
      port: ${ECP_REDIS_STATE_PORT:6380}
  jwt:
    # [ASSUMPTION] Security.md §4.2 — RS256 fallback (not the EdDSA assumption) chosen for this
    # sprint per Spring Security's NimbusJwtEncoder support. A dev keypair is generated in memory
    # when no key path is configured (JwtKeysConfig) — never do this in a real environment.
    private-key-path: ${ECP_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${ECP_JWT_PUBLIC_KEY_PATH:}
    issuer: ${ECP_JWT_ISSUER:ecp-api}
    access-token-ttl-seconds: ${ECP_JWT_ACCESS_TTL_SECONDS:900}
  password:
    # [ASSUMPTION] Security.md §4.5 — Argon2id parameters; re-tunable without a schema change.
    argon2-salt-length: 16
    argon2-hash-length: 32
    argon2-parallelism: 1
    argon2-memory-kib: 19456
    argon2-iterations: 2
  rate-limit:
    auth-strict:
      limit: 10
      window-seconds: 300
    write:
      limit: 120
      window-seconds: 60
  outbox:
    poll-delay-ms: ${ECP_OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${ECP_OUTBOX_BATCH_SIZE:100}
    payment-retry:
      limit: 5
      window-seconds: 900
    read:
      limit: 600
      window-seconds: 60
  revalidation:
    url: ${ECP_REVALIDATION_URL:}
    secret: ${ECP_REVALIDATE_SECRET:}
    consumer-group: ${ECP_REVALIDATION_CONSUMER_GROUP:ecp.web-revalidation}

management:
  server:
    port: ${ECP_MANAGEMENT_PORT:9001}
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, flywayGatedReadiness

logging:
  structured:
    format:
      console: logstash
