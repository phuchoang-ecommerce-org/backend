services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=ecp'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432'
  kafka:
    image: 'confluentinc/cp-kafka:7.7.1'
    environment:
      - 'CLUSTER_ID=JrIAvK6zTLazVsN9pjMvhA'
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
    ports:
      - '9092'
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:9.3.3'
    environment:
      - 'ELASTIC_PASSWORD=secret'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
    ports:
      - '9200'
      - '9300'
  mongodb:
    image: 'mongo:latest'
    environment:
      - 'MONGO_INITDB_DATABASE=mydatabase'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '27017'
  # ADR-0034 — two Redis instances, split by what eviction would cost. redis-cache holds pure
  # cache content (evictable, no persistence); redis-state holds correctness-bearing state —
  # rate-limit counters, sessions — and must never silently evict (noeviction + AOF persistence).
  redis-cache:
    image: 'redis:7'
    command: >-
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --maxmemory-samples 10
      --save ""
      --appendonly no
      --timeout 300
      --tcp-keepalive 60
    ports:
      - '6379'
  redis-state:
    image: 'redis:7'
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --save "900 1"
      --timeout 300
      --tcp-keepalive 60
    ports:
      - '6380:6379'
