[versions]
java = "21"
springBoot = "4.1.1"
springModulith = "2.1.1"
lombok = "1.18.48"
mapstruct = "1.6.3"
mapstructLombokBinding = "0.2.0"
jmoleculesBom = "2025.0.2"
archunit = "1.3.0"
postgresql = "42.7.4"
testcontainers = "1.20.4"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "mapstructLombokBinding" }
jmolecules-ddd = { module = "org.jmolecules:jmolecules-ddd" }
jmolecules-events = { module = "org.jmolecules:jmolecules-events" }
jmolecules-spring-integration = { module = "org.jmolecules.integrations:jmolecules-spring" }
jmolecules-archunit = { module = "org.jmolecules.integrations:jmolecules-archunit" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
jmolecules-bom = { module = "org.jmolecules:jmolecules-bom", version.ref = "jmoleculesBom" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
